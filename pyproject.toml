[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scare"
version = "0.1.0"
description = "Community-based Adaptive Resilience for Energy Systems"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Rico Schrage", email = "rico.schrage@uni-oldenburg.de"},
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]
keywords = ["multi-agent", "energy systems", "resilience", "restoration", "ADMM"]
# mango-agents, mango-energy-environments, distributed-resource-optimization and
# monee are sibling source checkouts, not releases. They are deliberately NOT
# listed here: PEP 508 file:// URLs must be absolute, so pinning them made the
# project installable on exactly one machine. Install them first, in order --
# see README "Installation". mango-agents in particular MUST come from the
# feature-transactional-apis branch; the PyPI release of the same name is
# different code and will silently shadow it.
dependencies = [
    "plotly>=5.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "kaleido",
    "gurobipy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # 8 tests carry @pytest.mark.timeout; without this the mark is silently
    # inert and those tests can hang a CI run instead of failing.
    "pytest-timeout>=2.3",
    "ruff>=0.15",
]

[project.urls]
Repository = "https://github.com/Digitalized-Energy-Systems/scare"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running test, deselect with -m 'not slow'",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files are re-export shells: names imported for the public
# surface are "unused" inside the module but intentionally re-exported.
"__init__.py" = ["F401"]
