[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scare"
version = "0.1.0"
description = "Community-based Adaptive Resilience for Energy Systems"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Rico Schrage", email = "rico.schrage@uni-oldenburg.de"},
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]
keywords = ["multi-agent", "energy systems", "resilience", "restoration", "ADMM"]
dependencies = [
    "mango-agents @ file:///home/rico/git/mango",
    "mango-energy-environments @ file:///home/rico/git/mango-energy-environments",
    "distributed-resource-optimization @ file:///home/rico/git/distributed-resource-optimization",
    "monee @ file:///home/rico/git/monee",
    "plotly>=5.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "kaleido",
    "gurobipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.urls]
Repository = "https://github.com/Digitalized-Energy-Systems/scare"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
